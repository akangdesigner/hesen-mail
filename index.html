function send(){

  const text = ta.value.trim(), atts = attDraft[id] || []; if (!text && !atts.length) return;

  const full = [text, attText(atts)].filter(Boolean).join("\n");
  if (!m.answer && !m.check){ save(); render(); snack("郵件已傳送"); return; }
  const before = JSON.stringify(Object.assign({}, S, {cp:null, hist:null, thread:Object.assign({}, S.thread, {[id]:th.slice(0, -1)})}));
  const res = m.check ? m.check(full) : matches(text, m.answer) ? "ok" : m.alt && matches(text, m.alt.answer) ? "alt" : null;
  if (res === "fail"){
    S.cp = before; S.failed = true; S.failId = m.failMail || "fail"; th.push({k:"reply", s:m.failReply || "收到，感謝您的配合。", t:now()}); save(); render(); snack("郵件已傳送");
    setTimeout(() => arrive(m.failMail || "fail"), 4000); return;
  }
  if (res === "ok" || res === "alt"){
    pushHist(before);
    S.solved[id] = true; if (res === "alt") S.alt[id] = true; save(); render(); snack("郵件已傳送");
    setTimeout(() => { th.push({k:"reply", s:replyOf(id), t:now()}); save(); if (S.open === id) render(); }, 1500);
    nextOf(id).forEach((nx, i) => setTimeout(() => arrive(nx), 4000 + i*2500));
  } else {
    S.wrong[id] = (S.wrong[id] || 0) + 1; save(); render(); snack("郵件已傳送");
    const r = res ? {k:"reply", s:res} : m.threat ? {k:"reply", s:THREAT_WRONG} : {k:"auto", s:"您好，我不太確定您的意思，可以再確認一次嗎？謝謝。"};
    setTimeout(() => { th.push({...r, t:now()}); save(); if (S.open === id) render(); }, 1500);
  }
}
function arrive(id){

  S.arrived.push({id, time:now()}); save();

  if (DLP && !ev.target.closest("#dlp, [data-act=xsave]")){ DLP = false; renderDlp(); }
  const tb = ev.target.closest("[data-tab]"); if (tb){ S.tab = tb.dataset.tab; S.lbl = null; save(); render(); return; }
  const lb = ev.target.closest("[data-lbl]"); if (lb){ S.lbl = lb.dataset.lbl || null; if (!S.lbl) S.tab = "main"; S.open = null; S.site = null; save(); render(); return; }
  const sn = ev.target.closest("[data-snap]"); if (sn){ openSnap(+sn.dataset.snap); return; }
  const pk = ev.target.closest("[data-pk]"); if (pk){ PK.sel = +pk.dataset.pk; if (ev.detail === 2) pickOk(); else renderPicker(); return; }
  const l = ev.target.closest("[data-site], [data-sp]");
  if (l){ ev.preventDefault(); if (l.dataset.site) openSite(l.dataset.site); else { S.site.page = l.dataset.sp; save(); renderSite(); } return; }
  const t = ev.target.closest("[data-att], [data-sheet]"); if (!t) return;
  if (t.dataset.att){ VW = {v:t.dataset.att, name:t.dataset.name, sheet:0, unlocked:false}; renderViewer(); }
  else if (VW){ VW.sheet = +t.dataset.sheet; renderViewer(); }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "ta") drafts[S.open] = ev.target.value;
  if (ev.target.id === "dq"){ S.site.q = ev.target.value; $("dres").innerHTML = dirRows(); }
});
document.addEventListener("change", ev => { if (ev.target.id === "dd"){ S.site.d = ev.target.value; save(); renderSite(); } });
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey) && ev.target.id === "ta"){ ev.preventDefault(); send(); return; }
  if (ev.key === "Enter" && ev.target.id === "pw"){ ev.preventDefault(); tryPw(); return; }
  if (ev.key === "Enter" && /^sq\d$/.test(ev.target.id)){ ev.preventDefault(); track(); return; }
  if (ev.key === "Enter" && (ev.target.id === "gp" || ev.target.id === "ga")){ ev.preventDefault(); ptin(); return; }
  if (ev.key === "Enter" && (ev.target.id === "pp" || ev.target.id === "pa")){ ev.preventDefault(); plogin(); return; }
  if (ev.key === "Escape" && S.name){
    ev.preventDefault(); $("snack").hidden = true; VW = null; renderViewer(); PK = null; renderPicker(); DLP = false; renderDlp();
    if (bossFrom !== undefined){ const b = bossFrom; bossFrom = undefined; S.site = b.site; if (b.open) open(b.open); else { S.open = null; save(); render(); } }
    else { bossFrom = {open:S.open, site:S.site}; S.site = null; open("hr"); }
  }
});

if (S.name) applyName();
render(); if (S.name) updateCount();
})();
</script>

</html>
